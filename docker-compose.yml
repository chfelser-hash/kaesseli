services:
  budget:
    build: .
    image: haushaltsbudget:latest
    container_name: haushaltsbudget
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Daten bleiben ausserhalb des Containers (auf der Synology z.B. /volume1/docker/budget/data)
      - ./data:/data
    environment:
      - TZ=Europe/Zurich
      # Auf "true" setzen, wenn die App nur über HTTPS (Reverse Proxy) erreichbar ist
      - COOKIE_SECURE=false
